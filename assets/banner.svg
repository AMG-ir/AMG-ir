<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Matin Ghorbani</title>
  <desc id="d">Computer Engineering student focused on networking, Linux, Windows Server and Python</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10213d"/>
      <stop offset="1" stop-color="#0c3a4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- network topology -->
  <g stroke="#67e8f9" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="860" y1="90" x2="980" y2="160"/>
    <line x1="980" y1="160" x2="1100" y2="80"/>
    <line x1="980" y1="160" x2="1060" y2="250"/>
    <line x1="1100" y1="80" x2="1200" y2="170"/>
    <line x1="1200" y1="170" x2="1060" y2="250"/>
    <line x1="980" y1="160" x2="880" y2="240"/>
    <line x1="860" y1="90" x2="760" y2="170"/>
    <line x1="760" y1="170" x2="880" y2="240"/>
  </g>
  <g fill="#0b1220" stroke="#67e8f9" stroke-width="2">
    <circle cx="860" cy="90" r="7"/>
    <circle cx="1100" cy="80" r="7"/>
    <circle cx="1200" cy="170" r="7"/>
    <circle cx="1060" cy="250" r="7"/>
    <circle cx="880" cy="240" r="7"/>
    <circle cx="760" cy="170" r="7"/>
  </g>
  <g>
    <circle cx="980" cy="160" r="13" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="r" values="13;17;13" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="160" r="5" fill="#22d3ee"/>
  </g>

  <!-- text -->
  <text x="80" y="88" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#34d399">~$ whoami</text>
  <rect x="196" y="71" width="11" height="22" fill="#34d399">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="78" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Matin Ghorbani</text>
  <text x="80" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#67e8f9">Networking  ·  Linux  ·  Windows Server  ·  Python</text>
  <text x="80" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">Computer Engineering Student  ·  Mashhad, Iran</text>

  <rect y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
